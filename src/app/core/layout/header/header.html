<header>
    <nav>
        <div class="navigation-side">
            <ul>
                <li><a routerLink="/" class="logo">Foodie</a></li>
                <li>
                    <a routerLink="/menu" routerLinkActive="active" class="menu-link">Menu</a>
                </li>
            </ul>
        </div>
        <div class="auth-side">
            @if (auth.isLoggedIn()) {
            <ul>
                <li>
                    <a routerLink="/cart" class="cart-btn" aria-label="Cart">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="9" cy="21" r="1" />
                            <circle cx="20" cy="21" r="1" />
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
                        </svg>
                        @if (cartService.count() > 0) {
                        <span class="cart-badge">{{ cartService.count() > 99 ? '99+' : cartService.count() }}</span>
                        }
                    </a>
                </li>
                <li class="profile">
                    <button type="button" class="profile-btn" (click)="toggleMenu()" aria-label="Account menu"
                        [attr.aria-expanded]="menuOpen()">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                    </button>
                    @if (menuOpen()) {
                    <div class="dropdown">
                        <p class="dropdown-hello">Hello: {{ auth.userName() ?? 'User' }}</p>
                        <a class="dropdown-item" routerLink="/profile" (click)="closeMenu()">Profile</a>
                        <button type="button" class="dropdown-item" (click)="logout()">Logout</button>
                    </div>
                    }
                </li>
            </ul>
            } @else {
            <ul>
                <li><a routerLink="/signin" class="login">Login</a></li>
                <li><a routerLink="/signup" class="signup">Sign Up</a></li>
            </ul>
            }
        </div>
    </nav>
</header>
